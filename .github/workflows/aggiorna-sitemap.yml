# Ogni volta che recipes.js viene modificato, questo automatismo rigenera due
# cose e le salva nel sito:
#
#   - sitemap.xml, per far sapere a Google che esiste una ricetta nuova;
#   - la cartella r/, le paginette che danno a WhatsApp e simili il titolo e la
#     foto giusti quando si condivide il link di una ricetta;
#   - l'elenco di collegamenti dentro "Il diario.dc.html", che da' ai motori di
#     ricerca dei link veri alle ricette.
#
# Non c'e' niente da installare o da avviare: gira sui computer di GitHub.

name: Aggiorna sitemap e anteprime

on:
  push:
    branches: [main]
    paths:
      - "recipes.js"
      - "scripts/genera-sitemap.js"
      - "scripts/genera-pagine-ricette.js"
      - "scripts/genera-elenco-ricette.js"
  workflow_dispatch: # permette anche di lanciarlo a mano dalla scheda Actions

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rigenera la sitemap
        run: node scripts/genera-sitemap.js

      - name: Rigenera le paginette per le anteprime
        run: node scripts/genera-pagine-ricette.js

      - name: Rigenera l'elenco dei collegamenti nel diario
        run: node scripts/genera-elenco-ricette.js

      - name: Salva quello che e' cambiato
        run: |
          git add -A sitemap.xml r "Il diario.dc.html"
          if git diff --cached --quiet; then
            echo "Nessuna ricetta nuova: sitemap e anteprime erano gia' aggiornate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sitemap e anteprime aggiornate automaticamente"
          git push
