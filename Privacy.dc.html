<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy — Le ricette di Mara</title>
<meta name="description" content="Informativa privacy del sito Le ricette di Mara: questo sito non usa cookie e non raccoglie dati personali.">
<link rel="canonical" href="https://www.lericettedimara.it/Privacy.dc.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Le ricette di Mara">
<meta property="og:locale" content="it_IT">
<meta property="og:title" content="Privacy — Le ricette di Mara">
<meta property="og:description" content="Informativa privacy del sito Le ricette di Mara: questo sito non usa cookie e non raccoglie dati personali.">
<meta property="og:url" content="https://www.lericettedimara.it/Privacy.dc.html">
<meta property="og:image" content="https://www.lericettedimara.it/assets/hero-index.png">
<meta name="twitter:card" content="summary_large_image">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #EFE3CB; }
  ::selection { background: #e8c9a0; }
  a { color: #9E3F26; }
  a:hover { color: #BE5A34; }
  .nav-toggle { display:none; }
  @media (max-width:640px) {
    .nav-links { display:none !important; }
    .nav-toggle { display:inline-flex !important; }
    .page-outer { padding:0 !important; }
    .page-card { max-width:100% !important; }
  }
</style>
</helmet>

<div class="page-outer" style="background:#EFE3CB; min-height:100vh; padding:40px 24px; font-family:'Spectral',Georgia,serif; color:#3A2C22;">
<div class="page-card" style="max-width:1180px; margin:0 auto; background:#FBF4E6;">

  <!-- topbar -->
  <div style="display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; padding:26px clamp(28px,5vw,64px); border-bottom:1px solid rgba(58,44,34,.12);">
    <a href="index.dc.html" style="text-decoration:none; color:#3A2C22; font-family:'DM Serif Display',serif; font-size:22px; letter-spacing:.01em;">{{ t.brand }}</a>
    <div style="display:flex; gap:clamp(16px,2.4vw,30px); align-items:center;">
      <div class="nav-links" style="display:flex; flex-wrap:wrap; row-gap:8px; gap:clamp(14px,2vw,26px); align-items:center; font-family:'Courier Prime',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase;">
        <a href="index.dc.html" style="text-decoration:none; color:#7A6552;" style-hover="color:#BE5A34;">Home</a>
        <a href="Il diario.dc.html" style="text-decoration:none; color:#7A6552;" style-hover="color:#BE5A34;">{{ t.navRecipes }}</a>
        <a href="Il calendario.dc.html" style="text-decoration:none; color:#7A6552;" style-hover="color:#BE5A34;">{{ t.navCal }}</a>
        <a href="La nostra storia.dc.html" style="text-decoration:none; color:#7A6552;" style-hover="color:#BE5A34;">{{ t.navStory }}</a>
        <a href="Contatti.dc.html" style="text-decoration:none; color:#7A6552;" style-hover="color:#BE5A34;">{{ t.navContact }}</a>
      </div>
      <div style="display:flex; gap:9px; align-items:center; font-family:'Spectral',serif; font-size:14px;">
        <span onClick="{{ onIt }}" style="{{ itStyle }}">IT</span>
        <span style="color:#C9B79A;">/</span>
        <span onClick="{{ onEn }}" style="{{ enStyle }}">EN</span>
      </div>
      <div class="nav-toggle" onClick="{{ onMenuToggle }}" style="align-items:center; justify-content:center; width:34px; height:34px; border:1px solid rgba(58,44,34,.25); border-radius:6px; cursor:pointer; font-size:16px; color:#3A2C22;">☰</div>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-direction:column; padding:6px clamp(28px,5vw,64px) 18px; border-bottom:1px solid rgba(58,44,34,.12); font-family:'Courier Prime',monospace; font-size:13px; letter-spacing:.1em; text-transform:uppercase;">
      <a href="index.dc.html" style="text-decoration:none; color:#7A6552; padding:10px 0;">Home</a>
      <a href="Il diario.dc.html" style="text-decoration:none; color:#7A6552; padding:10px 0;">{{ t.navRecipes }}</a>
      <a href="Il calendario.dc.html" style="text-decoration:none; color:#7A6552; padding:10px 0;">{{ t.navCal }}</a>
      <a href="La nostra storia.dc.html" style="text-decoration:none; color:#7A6552; padding:10px 0;">{{ t.navStory }}</a>
      <a href="Contatti.dc.html" style="text-decoration:none; color:#7A6552; padding:10px 0;">{{ t.navContact }}</a>
    </div>
  </sc-if>

  <!-- header -->
  <div style="padding:clamp(44px,6vw,72px) clamp(28px,5vw,64px) 8px; max-width:760px;">
    <div style="font-family:'Courier Prime',monospace; font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:#9E3F26; margin:0 0 18px;">{{ t.kicker }}</div>
    <h1 style="font-family:'DM Serif Display',serif; font-size:clamp(44px,6vw,62px); line-height:1.04; margin:0; font-weight:400;">{{ t.title }}</h1>
    <div style="width:56px; height:2px; background:#BE5A34; margin-top:28px;"></div>
  </div>

  <!-- privacy -->
  <div style="padding:36px clamp(28px,5vw,64px) 8px; max-width:680px;">
    <div style="font-family:'DM Serif Display',serif; font-size:26px; margin-bottom:14px;">{{ t.privacyHead }}</div>
    <div style="font-size:18px; line-height:1.75; color:#4A3A2E;">
      <sc-for list="{{ t.privacyBody }}" as="para" hint-placeholder-count="4">
        <p style="margin:0 0 18px;">{{ para }}</p>
      </sc-for>
    </div>
  </div>

  <!-- riutilizzo -->
  <div style="padding:16px clamp(28px,5vw,64px) 48px; max-width:680px;">
    <div style="font-family:'DM Serif Display',serif; font-size:26px; margin-bottom:14px;">{{ t.reuseHead }}</div>
    <div style="font-size:18px; line-height:1.75; color:#4A3A2E;">
      <sc-for list="{{ t.reuseBody }}" as="para" hint-placeholder-count="2">
        <p style="margin:0 0 18px;">{{ para }}</p>
      </sc-for>
    </div>
  </div>

  <!-- back to recipes -->
  <div style="margin:0 clamp(28px,5vw,64px) 60px; display:flex; justify-content:flex-start;">
    <a href="index.dc.html" style="text-decoration:none; background:#BE5A34; color:#FBF4E6; font-family:'Spectral',serif; font-size:15px; letter-spacing:.02em; padding:13px 26px; border-radius:2px;">{{ t.cta }}</a>
  </div>

  <!-- footer -->
  <div style="padding:22px clamp(28px,5vw,64px) 32px; border-top:1px solid rgba(58,44,34,.12); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
    <div style="font-size:13px; font-style:italic; color:#7A6552;">{{ t.footer }}</div>
  </div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: "it", menuOpen: false };

  renderVals() {
    const en = this.state.lang === "en";

    const IT = {
      brand: "Le ricette di Mara",
      navRecipes: "Ricette",
      navStory: "La nostra storia",
      navCal: "Calendario",
      navContact: "Contatti",
      kicker: "Note legali",
      title: "Privacy e riutilizzo",
      privacyHead: "Privacy",
      privacyBody: [
        "Questo sito non raccoglie né conserva dati personali, e non usiamo cookie, strumenti di analisi o tracciamento di alcun tipo.",
        "Le pagine caricano i caratteri da Google Fonts: per mostrarli, il tuo browser contatta i server di Google, che potrebbero registrare il tuo indirizzo IP secondo la loro informativa.",
        "Se ci scrivi dalla pagina Contatti, si apre semplicemente il tuo programma di posta: non raccogliamo né conserviamo sul sito l'indirizzo o il contenuto del messaggio."
      ],
      reuseHead: "Riutilizzo dei contenuti",
      reuseBody: [
        "Le ricette pubblicate qui nascono dalle mail che Mara ha inviato ad Alessandra: le condividiamo perché in tanti, negli anni, ce le hanno chieste.",
        "Siamo felici se vuoi provarle, cucinarle o ricondividerle altrove — ti chiediamo solo la cortesia di citare la fonte (“Le ricette di Mara”, con un link a questo sito) quando lo fai. Grazie!"
      ],
      cta: "Torna alle ricette",
      footer: "Questo sito non usa cookie."
    };
    const EN = {
      brand: "Mara's Recipes",
      navRecipes: "Recipes",
      navStory: "Our story",
      navCal: "Calendar",
      navContact: "Contact",
      kicker: "Legal notes",
      title: "Privacy & reuse",
      privacyHead: "Privacy",
      privacyBody: [
        "This site does not collect or store any personal data, and we don't use cookies, analytics or tracking tools of any kind.",
        "Pages load fonts from Google Fonts: to display them, your browser contacts Google's servers, which may log your IP address under their own policy.",
        "If you write to us from the Contact page, it simply opens your own email app: we don't collect or store the address or the message content on the site."
      ],
      reuseHead: "Reusing this content",
      reuseBody: [
        "The recipes published here come from the emails Mara sent Alessandra: we share them because, over the years, many people have asked us for them.",
        "We're happy if you'd like to try them, cook them or share them elsewhere — we'd just ask that you credit the source (“Mara's Recipes”, with a link back to this site) when you do. Thank you!"
      ],
      cta: "Back to the recipes",
      footer: "This site does not use cookies."
    };
    const t0 = en ? EN : IT;

    const active = { fontWeight: 700, color: "#BE5A34", cursor: "pointer", letterSpacing: ".04em" };
    const idle = { fontWeight: 400, color: "#9A836C", cursor: "pointer", letterSpacing: ".04em" };

    return {
      t: t0,
      itStyle: en ? idle : active,
      enStyle: en ? active : idle,
      onIt: () => this.setState({ lang: "it" }),
      onEn: () => this.setState({ lang: "en" }),
      menuOpen: this.state.menuOpen,
      onMenuToggle: () => this.setState({ menuOpen: !this.state.menuOpen })
    };
  }
}
</script>
</body>
</html>
